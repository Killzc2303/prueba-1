<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página desde QR</title>

<style>
body {
  font-family: Arial, sans-serif;
  background-color: #f2f4f8;
  margin: 0;
  padding: 0;
}

.container {
  max-width: 500px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  text-align: center;
}

.btn {
  background: #1976d2;
  color: white;
  padding: 12px 25px;
  margin: 10px 0;
  border: none;
  width: 100%;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
}

img {
  width: 100%;
  border-radius: 12px;
  margin-top: 20px;
}
</style>

</head>
<body>

<div class="container">
  <h2>Imágenes desde QR</h2>
  <p>Presiona un botón para ver la imagen correspondiente.</p>

  <!-- Botones -->
  <button class="btn" id="btn1">Imagen 1</button>
  <button class="btn" id="btn2">Imagen 2</button>

  <!-- Imagen dinámica -->
  <img id="preview" src="" alt="Aquí aparecerá la imagen">
</div>

<script>

// URL de las dos imágenes
const img1 = "https://static.wikia.nocookie.net/jujutsu-kaisen/images/a/a2/Satoru_Gojo_-_Anime.jpg/revision/latest?cb=20201017190313&path-prefix=es";
const img2 = "https://i.imgur.com/Jzf1pKJ.jpeg";  // Imagen provisional, puedes reemplazarla

// Botón 1
document.getElementById("btn1").addEventListener("click", () => {
  document.getElementById("preview").src = img1;
});

// Botón 2
document.getElementById("btn2").addEventListener("click", () => {
  document.getElementById("preview").src = img2;
});

</script>

</body>
</html>
