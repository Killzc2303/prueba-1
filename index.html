<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Imágenes con Botones</title>
    <style>
        /* Estilos CSS básicos para centrar y mejorar la presentación */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        #imagenMostrada {
            margin-top: 30px;
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            display: none; /* Inicialmente oculta hasta que se pulse un botón */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ Selecciona una Imagen</h1>

        <button onclick="mostrarImagen('imagen1')">Mostrar Gato 🐱</button>
        <button onclick="mostrarImagen('imagen2')">Mostrar Perro 🐶</button>

        <img id="imagenMostrada" src="" alt="Aquí aparecerá la imagen seleccionada">

    </div>

    <script>
        // FUNCIÓN JAVASCRIPT para cambiar la imagen
        function mostrarImagen(tipoImagen) {
            const imagenElement = document.getElementById('imagenMostrada');
            let urlImagen = '';

            // Definimos las URLs de las imágenes
            // **IMPORTANTE**: Reemplaza estas URLs de ejemplo con las URLs reales
            // de las imágenes que quieres usar.
            if (tipoImagen === 'imagen1') {
                // URL de tu primera imagen (ejemplo: un gato)
                urlImagen = 'https://picsum.photos/400/300?random=1'; 
                imagenElement.alt = 'Un gato aleatorio';
            } else if (tipoImagen === 'imagen2') {
                // URL de tu segunda imagen (ejemplo: un perro)
                urlImagen = 'https://picsum.photos/400/300?random=2'; 
                imagenElement.alt = 'Un perro aleatorio';
            }

            // Asigna la nueva URL a la imagen y la hace visible
            if (urlImagen) {
                imagenElement.src = urlImagen;
                imagenElement.style.display = 'block';
            }
        }
    </script>
</body>
</html>
