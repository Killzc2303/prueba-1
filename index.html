<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Página con 2 botones - QR</title>
  <style>
    :root{
      --bg:#f6f7fb; --card:#fff; --accent:#2b6cb0; --muted:#666;
    }
    *{box-sizing:border-box}
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      margin:0;background:var(--bg);
      display:flex;min-height:100vh;align-items:center;justify-content:center;
      padding:20px;
    }
    .card{
      background:var(--card);padding:28px;border-radius:12px;
      box-shadow:0 8px 30px rgba(20,30,40,0.08);width:min(920px,98%);text-align:center;
    }
    h1{margin:0 0 6px;font-size:20px}
    p.lead{margin:0 0 18px;color:var(--muted)}
    .controls{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
    .btn{
      appearance:none;border:0;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;
      
::contentReference[oaicite:0]{index=0}
