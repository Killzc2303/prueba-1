<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Imágenes Locales</title>
    <style>
        /* Estilos CSS básicos (los mismos del ejemplo anterior) */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        #imagenMostrada {
            margin-top: 30px;
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ Selecciona una Imagen Local</h1>

        <button onclick="mostrarImagen('gato')">Mostrar Gato 🐱</button>
        <button onclick="mostrarImagen('perro')">Mostrar Perro 🐶</button>

        <img id="imagenMostrada" src="" alt="Aquí aparecerá la imagen seleccionada">

    </div>

    <script>
        // FUNCIÓN JAVASCRIPT para cambiar la imagen
        function mostrarImagen(tipoImagen) {
            const imagenElement = document.getElementById('imagenMostrada');
            let urlImagen = '';

            // **RUTAS RELATIVAS**
            // Las rutas apuntan a la carpeta 'images'
            if (tipoImagen === 'gato') {
                urlImagen = 'images/gato.jpg'; // Asegúrate de que tu imagen se llame 'gato.jpg'
                imagenElement.alt = 'Un lindo gato';
            } else if (tipoImagen === 'perro') {
                urlImagen = 'images/perro.jpg'; // Asegúrate de que tu imagen se llame 'perro.jpg'
                imagenElement.alt = 'Un perro amigable';
            }

            // Asigna la nueva URL y hace visible la imagen
            if (urlImagen) {
                imagenElement.src = urlImagen;
                imagenElement.style.display = 'block';
            }
        }
    </script>
</body>
</html>
